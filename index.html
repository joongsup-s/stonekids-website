    transform: translateY(0);
  }

  .video-card.featured {
    grid-column: 1 / -1;
  }

  .thumb-wrap {
    position: relative;
    width: 100%;
    padding-bottom: 56.25%;
    background: var(--gray-100);
    overflow: hidden;
    border-radius: 2px;
  }

  .video-card.featured .thumb-wrap {
    padding-bottom: 45%;
  }

  .thumb-wrap iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
  }

  .thumb-wrap img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.6s ease, filter 0.6s ease;
  }

  .video-card:hover .thumb-wrap img {
    transform: scale(1.04);
  }

  .play-btn {
    position: absolute;
    top: 50%;
    left: 50%;

    height: 64px;

    justify-content: center;

    width: 0;
    height: 0;
    border-style: solid;
    border-width: 10px 0 10px 18px;
    border-color: transparent transparent transparent white;

    aspect-ratio: 16/9;
    position: relative;
  }

  .lightbox-content iframe {
    width: 100%;
    height: 100%;
    border: none;
    border-radius: 2px;

    position: absolute;
    top: 24px;
    right: 24px;

    height: 48px;

    border: 1px solid rgba(255,255,255,0.3);

    display: flex;
    align-items: center;
    justify-content: center;

    .hero h1 { letter-spacing: 4px; }

  }

  /* ── SCROLL ANIMATIONS ── */
  .fade-up {
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }

  .fade-up.visible {
    opacity: 1;
    transform: translateY(0);

</style>
</head>

  if (v.cover) return v.cover;
  if (v.platform === "vimeo") {
    return `https://vumbnail.com/${v.id}.jpg`;
  }
  return `https://img.youtube.com/vi/${v.id}/hqdefault.jpg`;
}

function getEmbedUrl(v) {
  if (v.platform === "vimeo") {
    return `https://player.vimeo.com/video/${v.id}?autoplay=1&title=0&byline=0&portrait=0`;
  }
  return `https://www.youtube.com/embed/${v.id}?autoplay=1&rel=0&modestbranding=1`;
}

const grid = document.getElementById('videoGrid');

  card.innerHTML = `
    <div class="thumb-wrap">
      <img src="${getThumb(v)}" alt="${v.title}" loading="lazy"${v.cover ? '' : `

    openLightbox(v);
  });
  const making = card.querySelector('.video-making');
  if (making) making.addEventListener('click', (e) => e.stopPropagation());
  grid.appendChild(card);
});

// Lightbox
const lightbox = document.getElementById('lightbox');
const lightboxIframe = document.getElementById('lightboxIframe');
const lightboxClose = document.getElementById('lightboxClose');

function openLightbox(v) {
  lightboxIframe.src = getEmbedUrl(v);
  lightbox.style.display = 'flex';
  requestAnimationFrame(() => lightbox.classList.add('active'));
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  lightbox.classList.remove('active');
  setTimeout(() => {
    lightbox.style.display = 'none';
    lightboxIframe.src = '';
  }, 300);
  document.body.style.overflow = '';
}

lightboxClose.addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e) => {
  if (e.target === lightbox) closeLightbox();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeLightbox();
});

// Intersection Observer for scroll animations
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('visible');
    }
  });
}, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });

document.querySelectorAll('.video-card, .fade-up').forEach(el => observer.observe(el));
</script>
